version: '3.8'

# Exemplo de Docker Compose para testar escalabilidade
# Execute com: docker-compose -f docker-compose-escalado.yml up -d

services:
  controlador:
    build: ./controlador
    container_name: controlador-central
    command: java -cp target/classes:target/dependency/* org.example.ControladorCentralKafka
    ports:
      - "8083:8080"
    depends_on:
      - kafka
    networks:
      - fabrica-net

  # 3 Robôs de Soldagem
  robo-soldagem-1:
    build: ./robo
    container_name: robo-soldagem-1
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka SOLDAGEM
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  robo-soldagem-2:
    build: ./robo
    container_name: robo-soldagem-2
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka SOLDAGEM
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  robo-soldagem-3:
    build: ./robo
    container_name: robo-soldagem-3
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka SOLDAGEM
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  # 2 Robôs de Pintura
  robo-pintura-1:
    build: ./robo
    container_name: robo-pintura-1
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka PINTURA
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  robo-pintura-2:
    build: ./robo
    container_name: robo-pintura-2
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka PINTURA
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  # 4 Robôs de Montagem
  robo-montagem-1:
    build: ./robo
    container_name: robo-montagem-1
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka MONTAGEM
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  robo-montagem-2:
    build: ./robo
    container_name: robo-montagem-2
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka MONTAGEM
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  robo-montagem-3:
    build: ./robo
    container_name: robo-montagem-3
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka MONTAGEM
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  robo-montagem-4:
    build: ./robo
    container_name: robo-montagem-4
    command: java -cp target/classes:target/dependency/* org.example.RoboKafka MONTAGEM
    depends_on:
      - controlador
      - kafka
    networks:
      - fabrica-net

  estoque:
    build: ./estoque
    container_name: gerenciador-estoque
    ports:
      - "8081:8081"
    networks:
      - fabrica-net

  monitor:
    build: ./monitor
    container_name: monitor-sistema
    ports:
      - "8082:8082"
    networks:
      - fabrica-net

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - fabrica-net

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_PORT: 9092
      # Mais partições para suportar mais robôs
      KAFKA_CREATE_TOPICS: "ordens-producao:3:1,status-robos:10:1,comandos-robos:10:1"
      # Configurações de performance
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
    networks:
      - fabrica-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fabrica-cluster-escalado
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - fabrica-net

networks:
  fabrica-net:
    driver: bridge

# Comandos para testar escalabilidade:
#
# 1. Iniciar sistema escalado:
#    docker-compose -f docker-compose-escalado.yml up -d
#
# 2. Verificar todos os containers:
#    docker ps --format "table {{.Names}}\t{{.Status}}"
#
# 3. Monitorar logs de um tipo específico:
#    docker logs -f robo-soldagem-1
#    docker logs -f robo-soldagem-2
#    docker logs -f robo-soldagem-3
#
# 4. Ver estatísticas no Kafka UI:
#    http://localhost:8080
#
# 5. Simular falha de um robô:
#    docker stop robo-soldagem-2
#    # Kafka redistribui trabalho automaticamente!
#
# 6. Reativar robô:
#    docker start robo-soldagem-2
#    # Robô volta ao pool automaticamente!
#
# 7. Parar sistema:
#    docker-compose -f docker-compose-escalado.yml down
